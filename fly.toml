app = 'xray-payload'
primary_region = 'ams'

[http_service]
  auto_start_machines = true
  auto_stop_machines = 'off'
  force_https = false
  internal_port = 3000
  min_machines_running = 0
  processes = ['app']

[[vm]]
  cpu_kind = 'shared'
  cpus = 1
  memory = '256mb'
